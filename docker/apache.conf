<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/html/public/storage>
        AllowOverride None
        Options -Indexes -ExecCGI
        SetHandler default-handler
    </Directory>
    <LocationMatch "(?i)^/storage/.*\.(php[0-9]*|phtml|phar)(/|$)">
        Require all denied
    </LocationMatch>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout "%m %U %>s %D"
</VirtualHost>
