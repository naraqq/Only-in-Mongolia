x-laravel: &laravel
  image: ${OIM_IMAGE:-only-in-mongolia:local}
  pull_policy: never
  env_file: ${OIM_ENV_FILE:-.env.docker}
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    FILESYSTEM_DISK: local
    LOG_CHANNEL: stderr
    SENTRY_RELEASE: ${OIM_RELEASE:-}
    TRUST_DOCKER_PROXY: "true"
    # Real-time updates: the app talks to the reverb container directly; browsers reach it through the proxy.
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
  volumes:
    - uploads:/var/www/html/storage/app

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HTTP_BIND:-127.0.0.1:8080}:80"
      - "${HTTPS_BIND:-127.0.0.1:8443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy

  app:
    <<: *laravel
    build: .
    scale: 3
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 3s
      retries: 6

  migrate:
    <<: *laravel
    user: www-data
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *laravel
    user: www-data
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 100s
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=75", "--max-time=3600"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Video conversion (App\Jobs\TranscodeVideo): its own worker, so a long video never holds up notifications.
  media-worker:
    <<: *laravel
    user: www-data
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 100s
    command: ["php", "artisan", "queue:work", "media", "--queue=media", "--tries=4", "--timeout=7200", "--max-jobs=50", "--memory=512"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *laravel
    user: www-data
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Real-time updates (Laravel Reverb): one long-running WebSocket server. Browsers connect through the proxy
  # (wss://your-site/app/...); the app and worker send it events over the internal network.
  reverb:
    <<: *laravel
    user: www-data
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]
    # Each open connection is a file handle.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 6

  db:
    image: mysql:8.4
    restart: unless-stopped
    # Same server defaults as compose.dev.yaml, so development, Docker and production behave alike.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.docker}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.docker}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  database:
  uploads:
  caddy_data:
  caddy_config:
